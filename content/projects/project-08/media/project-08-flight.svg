<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Drift, vector flight study</title>
  <desc id="desc">A monochrome field of angular birds, dotted texture, and looping flight paths.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252525" />
      <stop offset="0.52" stop-color="#111111" />
      <stop offset="1" stop-color="#353535" />
    </linearGradient>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="1" fill="#d8d5cc" opacity="0.18" />
      <circle cx="11" cy="8" r="0.8" fill="#d8d5cc" opacity="0.12" />
      <circle cx="6" cy="15" r="0.7" fill="#d8d5cc" opacity="0.16" />
      <circle cx="16" cy="14" r="0.6" fill="#d8d5cc" opacity="0.1" />
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <path d="M0 0V10" stroke="#e8e6e0" stroke-width="1" opacity="0.16" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#field)" />
  <rect width="1200" height="800" fill="url(#grain)" />
  <path d="M-80 645C190 420 350 720 585 470S1015 156 1280 290" fill="none" stroke="#d8d5cc" stroke-width="2" opacity="0.42" />
  <path d="M-50 704C250 514 354 784 627 540S1056 240 1260 370" fill="none" stroke="#d8d5cc" stroke-width="1" opacity="0.26" />

  <g fill="#e8e6e0">
    <path d="M233 238l122-51-52 69 78 11-124 18-71 43 38-56-83-2z" />
    <path d="M739 161l94 35-53 9 31 61-61-47-72 15 58-45-21-50z" opacity="0.88" />
    <path d="M602 475l146-73-61 71 93 25-130 4-83 55 47-68-91-4z" opacity="0.74" />
  </g>

  <g fill="url(#hatch)" opacity="0.82">
    <path d="M233 238l122-51-52 69 78 11-124 18-71 43 38-56-83-2z" />
    <path d="M739 161l94 35-53 9 31 61-61-47-72 15 58-45-21-50z" />
    <path d="M602 475l146-73-61 71 93 25-130 4-83 55 47-68-91-4z" />
  </g>

  <g fill="none" stroke="#e8e6e0" stroke-width="3" opacity="0.56">
    <circle cx="945" cy="581" r="106" />
    <circle cx="945" cy="581" r="74" stroke-dasharray="4 15" />
    <path d="M945 441v280M805 581h280" stroke-width="1" opacity="0.4" />
  </g>

  <g fill="#e8e6e0" font-family="SFMono-Regular,Consolas,monospace" letter-spacing="5">
    <text x="52" y="708" font-size="18" opacity="0.72">DRIFT / VECTOR STUDY</text>
    <text x="1052" y="742" font-size="18" opacity="0.58">08</text>
  </g>
  <rect x="22" y="22" width="1156" height="756" fill="none" stroke="#e8e6e0" stroke-width="2" opacity="0.5" />
</svg>
