name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html README.md favicon.svg _site/
          cp -r css js content _site/
          touch _site/.nojekyll

      # Note: do NOT add `enablement: true` here. It calls POST /repos/{owner}/{repo}/pages
      # to create the Pages site, which requires `administration: write` — a permission the
      # workflow GITHUB_TOKEN can never be granted, so it always fails with
      # "Resource not accessible by integration" (see actions/configure-pages#40).
      # Instead, a repo admin must enable Pages ONCE:
      #   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
      # After that, configure-pages reads the existing site config and every deploy is automatic.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
