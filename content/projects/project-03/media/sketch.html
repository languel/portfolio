<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project 03 — p5.js field study</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; min-height: 100%; background: #151515; }
      body { display: grid; place-items: center; overflow: hidden; }
      canvas { display: block; max-width: 100vw; max-height: 100vh; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  </head>
  <body>
    <script>
      const sketch = (p) => {
        const cells = 18;

        p.setup = () => {
          p.createCanvas(640, 360);
          p.noStroke();
          p.pixelDensity(1);
        };

        p.draw = () => {
          p.background(21);
          const t = p.frameCount * 0.012;
          const size = p.width / cells;

          for (let y = 0; y < cells; y += 1) {
            for (let x = 0; x < cells; x += 1) {
              const distance = p.dist(x, y, cells / 2, cells / 2);
              const wave = p.sin(distance * 0.82 - t * 3.2) * 0.5 + 0.5;
              const value = p.constrain(25 + wave * 180 - distance * 3.5, 8, 220);
              p.fill(value);
              p.rect(x * size, y * size, size - 1, size - 1);
            }
          }
        };
      };

      new p5(sketch);
    </script>
  </body>
</html>
